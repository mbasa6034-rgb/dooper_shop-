<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyShop Ethiopia</title>
    <!-- Font Awesome (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --green: #1a8a4a;
            --green-dark: #136035;
            --green-light: #e8f5ee;
            --yellow: #fcd116;
            --red: #ef4135;
            --gold: #f5a623;
            --bg: #f4f7f9;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #1e2a3a;
            line-height: 1.6;
            transition: background 0.3s;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            outline: none;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
            width: 100%;
            transition: border 0.2s;
            background: #fff;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(26, 138, 74, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eaeef3;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 10px;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
            color: #fff;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-area i {
            font-size: 2rem;
            color: var(--yellow);
        }
        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo-area h1 span {
            color: var(--yellow);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
        }
        .lang-btn i {
            font-size: 0.9rem;
        }
        .cart-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .cart-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
        }
        .cart-badge {
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -6px;
            right: -6px;
            border: 2px solid var(--green);
        }
        .admin-shortcut {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .admin-shortcut:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, var(--green-light) 0%, #d4edda 100%);
            padding: 40px 0 30px;
            border-bottom: 4px solid var(--yellow);
            text-align: center;
        }
        .hero h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 4px;
        }
        .hero h2 i {
            color: var(--gold);
            margin: 0 6px;
        }
        .hero p {
            font-size: 1.05rem;
            color: #2d4a3e;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
        }
        .hero .tag {
            display: inline-block;
            background: var(--yellow);
            color: #1e2a3a;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        /* ===== CATEGORY TABS ===== */
        .category-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px 0 10px;
        }
        .category-tabs button {
            padding: 10px 26px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            background: #fff;
            color: #2d4a3e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-tabs button i {
            font-size: 1rem;
        }
        .category-tabs button:hover {
            border-color: var(--green);
            transform: translateY(-2px);
        }
        .category-tabs button.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
            box-shadow: 0 4px 14px rgba(26, 138, 74, 0.3);
        }

        /* ===== PRODUCT GRID ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            padding: 20px 0 40px;
        }
        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12);
        }
        .product-img {
            height: 190px;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-img .no-img {
            color: #aab;
            font-size: 2.4rem;
            opacity: 0.3;
        }
        .product-body {
            padding: 16px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-body .cat-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--green);
            background: var(--green-light);
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 6px;
        }
        .product-body h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .product-body .price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--green-dark);
            margin: 4px 0 6px;
        }
        .product-body .price span {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6b7a8a;
        }
        .product-body .desc {
            font-size: 0.85rem;
            color: #4a5a6a;
            flex: 1;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-body .actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .product-body .actions button {
            flex: 1;
            padding: 8px 0;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add {
            background: var(--green);
            color: #fff;
        }
        .btn-add:hover {
            background: var(--green-dark);
            transform: scale(1.02);
        }
        .btn-buy {
            background: var(--yellow);
            color: #1e2a3a;
        }
        .btn-buy:hover {
            background: #e6b800;
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            color: var(--green);
            border: 2px solid var(--green);
        }
        .btn-outline:hover {
            background: var(--green);
            color: #fff;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7a8a;
        }
        .empty-state i {
            font-size: 3.5rem;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 1.1rem;
        }

        /* ===== CART SIDEBAR ===== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            max-width: 92vw;
            height: 100vh;
            background: #fff;
            z-index: 201;
            padding: 24px 20px;
            overflow-y: auto;
            transform: translateX(105%);
            transition: var(--transition);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
        }
        .cart-sidebar.open {
            transform: translateX(0);
        }
        .cart-sidebar .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2f7;
            margin-bottom: 16px;
        }
        .cart-sidebar .cart-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-sidebar .cart-header .close-btn {
            font-size: 1.5rem;
            color: #6b7a8a;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .cart-sidebar .cart-header .close-btn:hover {
            background: #f0f2f5;
            color: #1e2a3a;
        }
        .cart-item {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            align-items: center;
        }
        .cart-item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 10px;
            background: #f0f4f8;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .cart-item-info .cart-price {
            font-weight: 700;
            color: var(--green-dark);
            font-size: 0.9rem;
        }
        .cart-item .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-item .qty-control button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #eef2f7;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .cart-item .qty-control button:hover {
            background: var(--green);
            color: #fff;
        }
        .cart-item .qty-control span {
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }
        .cart-item .remove-item {
            color: #b0b8c4;
            transition: var(--transition);
            font-size: 1rem;
            padding: 4px;
        }
        .cart-item .remove-item:hover {
            color: var(--red);
        }
        .cart-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 2px solid #eef2f7;
        }
        .cart-footer .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .cart-footer .total-row span:last-child {
            color: var(--green-dark);
        }
        .cart-footer .checkout-btn {
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: #fff;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cart-footer .checkout-btn:hover {
            background: var(--green-dark);
            transform: scale(1.01);
        }
        .cart-footer .telegram-contact {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #4a5a6a;
            background: #f0f7fe;
            padding: 8px 12px;
            border-radius: 30px;
        }
        .cart-footer .telegram-contact i {
            color: #0088cc;
        }
        .cart-footer .telegram-contact strong {
            color: var(--green-dark);
        }

        /* ===== ADMIN ===== */
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .admin-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .admin-modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 32px 28px;
            width: 440px;
            max-width: 94vw;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.92);
            transition: var(--transition);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        }
        .admin-overlay.open .admin-modal {
            transform: scale(1);
        }
        .admin-modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .admin-modal .pwd-input {
            margin-bottom: 16px;
        }
        .admin-modal .pwd-input label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .admin-modal .pwd-input input {
            padding: 12px 16px;
        }
        .admin-modal .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .admin-modal .admin-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            font-weight: 700;
            transition: var(--transition);
        }
        .btn-primary {
            background: var(--green);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--green-dark);
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #c92a1f;
        }
        .btn-secondary {
            background: #eef2f7;
            color: #1e2a3a;
        }
        .btn-secondary:hover {
            background: #dce1e8;
        }

        /* ===== ADMIN DASHBOARD ===== */
        .admin-dash {
            display: none;
            padding: 24px 0 40px;
        }
        .admin-dash.active {
            display: block;
        }
        .admin-dash .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-dash .dash-header h2 {
            font-size: 1.5rem;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-dash .dash-header .admin-actions-top {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-dash .dash-header .admin-actions-top button {
            padding: 8px 20px;
