<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniStore Ethio | የዩኒቨርሲቲ ተማሪዎች መደብር</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0078ff;
      --accent: #ff9900;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    /* Header & Navigation */
    header {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      color: var(--accent);
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-lang {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .btn-lang:hover {
      background-color: rgba(255, 255, 255, 0.4);
    }

    .btn-admin {
      background-color: var(--accent);
      color: #000;
    }

    .btn-admin:hover {
      background-color: #e68a00;
    }

    /* Container & Categories */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .cat-btn {
      padding: 10px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-desc {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 15px;
    }

    .btn-buy {
      width: 100%;
      background-color: #0088cc; /* Telegram Color */
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-buy:hover {
      background-color: #006699;
    }

    /* Admin Panel Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .btn-submit {
      background: #2e7d32;
      color: white;
      flex: 1;
    }

    .btn-danger {
      background: #d32f2f;
      color: white;
    }

    .admin-list {
      margin-top: 25px;
      border-top: 2px solid var(--border);
      padding-top: 15px;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header-btns {
        gap: 5px;
      }
      .btn {
        padding: 6px 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-graduation-cap"></i> UniStore <span>Ethio</span>
    </div>
    <div class="header-btns">
      <button class="btn btn-lang" onclick="toggleLanguage()">
        <i class="fa-solid fa-globe"></i> <span id="lang-btn-text">አማርኛ</span>
      </button>
      <button class="btn btn-admin" onclick="openAdminModal()">
        <i class="fa-solid fa-user-gear"></i> <span id="admin-btn-text">Admin</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Category Filter -->
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('all')" id="cat-all">All / ሁሉም</button>
      <button class="cat-btn" onclick="filterCategory('education')" id="cat-edu">Educational Materials</button>
      <button class="cat-btn" onclick="filterCategory('cosmetics')" id="cat-cos">Cosmetics & Beauty</button>
      <button class="cat-btn" onclick="filterCategory('electronics')" id="cat-elec">Electronics</button>
    </div>

    <!-- Products Grid -->
    <div class="product-grid" id="product-grid">
      <!-- Products render dynamically here -->
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="admin-title">Manage Products (Admin)</h2>
        <span class="close-btn" onclick="closeAdminModal()">&times;</span>
      </div>

      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="prod-id">
        
        <div class="form-group">
          <label id="lbl-name">Product Name (English)</label>
          <input type="text" id="prod-name-en" required>
        </div>

        <div class="form-group">
          <label id="lbl-name-am">Product Name (Amharic)</label>
          <input type="text" id="prod-name-am" required>
        </div>

        <div class="form-group">
          <label id="lbl-cat">Category</label>
          <select id="prod-category" required>
            <option value="education">Educational Materials</option>
            <option value="cosmetics">Cosmetics & Beauty</option>
            <option value="electronics">Electronics</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lbl-price">Price (ETB / ብር)</label>
          <input type="number" id="prod-price" required>
        </div>

        <div class="form-group">
          <label id="lbl-img">Image URL</label>
          <input type="url" id="prod-img" placeholder="https://example.com/image.jpg" required>
        </div>

        <div class="form-group">
          <label id="lbl-desc">Description (English)</label>
          <textarea id="prod-desc-en" rows="2" required></textarea>
        </div>

        <div class="form-group">
          <label id="lbl-desc-am">Description (Amharic)</label>
          <textarea id="prod-desc-am" rows="2" required></textarea>
        </div>

        <div class="admin-actions">
          <button type="submit" class="btn btn-submit" id="btn-save">Save Product</button>
          <button type="button" class="btn btn-danger" onclick="resetForm()">Clear</button>
        </div>
      </form>

      <!-- Manage List -->
      <div class="admin-list">
        <h3>Existing Products</h3>
        <div id="admin-items-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Data (If LocalStorage is empty)
    const initialProducts = [
      {
        id: 1,
        nameEn: "Scientific Calculator (Fx-991EX)",
        nameAm: "ሳይንቲፊክ ካልኩሌተር (Fx-991EX)",
        category: "education",
        price: 1800,
        img: "https://images.unsplash.com/photo-1611125832047-1d7ad1e8e48a?auto=format&fit=crop&q=80&w=400",
        descEn: "Essential calculator for Engineering & Natural Science campus students.",
        descAm: "ለኢንጂነሪንግ እና ተፈጥሮ ሳይንስ ተማሪዎች አስፈላጊ ካልኩሌተር።"
      },
      {
        id: 2,
        nameEn: "Nivea Soft Moisturizing Cream",
        nameAm: "ኒቪያ ሶፍት እርጥበት ሰጪ ክሬም",
        category: "cosmetics",
        price: 450,
        img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&q=80&w=400",
        descEn: "Everyday face and body moisturization for harsh dorm weather.",
        descAm: "ለቀን ተቀን የፊት እና የሰውነት እንክብካቤ የሚሆን።"
      },
      {
        id: 3,
        nameEn: "Rechargeable LED Desk Light",
        nameAm: "ቻርጅ የሚደረግ የጥናት መብራት (LED)",
        category: "electronics",
        price: 1200,
        img: "https://images.unsplash.com/photo-1534073828943-f801091bb18c?auto=format&fit=crop&q=80&w=400",
        descEn: "Perfect for night studying during dorm power cuts.",
        descAm: "መብራት በሚጠፋበት ጊዜ ለምሽት ጥናት በጣም ጠቃሚ።"
      }
    ];

    const telegramUsername = "sky_dooper";
    let currentLang = 'en'; // 'en' or 'am'
    let currentCategory = 'all';

    // Fetch products from localStorage or load defaults
    function getProducts() {
      const stored = localStorage.getItem('unistore_products');
      if (!stored) {
        localStorage.setItem('unistore_products', JSON.stringify(initialProducts));
        return initialProducts;
      }
      return JSON.parse(stored);
    }

    function saveProductsToStorage(products) {
      localStorage.setItem('unistore_products', JSON.stringify(products));
      renderProducts();
      renderAdminList();
    }

    // Translations
    const i18n = {
      en: {
        catAll: "All Items",
        catEdu: "Educational",
        catCos: "Cosmetics & Beauty",
        catElec: "Electronics",
        buyBtn: "Buy via Telegram",
        adminTitle: "Manage Products (Admin)",
        lblImg: "Image URL",
        lblPrice: "Price (ETB)",
        saveBtn: "Save Product"
      },
      am: {
        catAll: "ሁሉም እቃዎች",
        catEdu: "ትምህርታዊ ቁሳቁሶች",
        catCos: "ኮስሞቲክስ እና ውበት",
        catElec: "ኤሌክትሮኒክስ",
        buyBtn: "በቴሌግራም ይግዙ",
        adminTitle: "ምርቶችን ያስተዳድሩ (አድሚን)",
        lblImg: "የምስል ሊንክ (URL)",
        lblPrice: "ዋጋ (በብር)",
        saveBtn: "ምርቱን መዝግብ"
      }
    };

    // Toggle Language
    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'am' : 'en';
      document.getElementById('lang-btn-text').innerText = currentLang === 'en' ? 'አማርኛ' : 'English';
      
      // Update UI texts
      document.getElementById('cat-all').innerText = i18n[currentLang].catAll;
      document.getElementById('cat-edu').innerText = i18n[currentLang].catEdu;
      document.getElementById('cat-cos').innerText = i18n[currentLang].catCos;
      document.getElementById('cat-elec').innerText = i18n[currentLang].catElec;
      document.getElementById('admin-title').innerText = i18n[currentLang].adminTitle;

      renderProducts();
    }

    // Filter by category
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts();
    }

    // Render Products Grid
    function renderProducts() {
      const products = getProducts();
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'all' 
        ? products 
        : products.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777;">No products available in this category.</p>`;
        return;
      }

      filtered.forEach(p => {
        const name = currentLang === 'en' ? p.nameEn : p.nameAm;
        const desc = currentLang === 'en' ? p.descEn : p.descAm;
        const buyText = i18n[currentLang].buyBtn;

        // Telegram link with dynamic pre-filled order message
        const message = encodeURIComponent(`Hello! I want to buy: ${p.nameEn} (Price: ${p.price} ETB)`);
        const telegramUrl = `https://t.me/${telegramUsername}?text=${message}`;

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" class="product-img" alt="${name}" onerror="this.src='https://via.placeholder.com/250x200?text=No+Image'">
          <div class="product-info">
            <div class="product-title">${name}</div>
            <div class="product-desc">${desc}</div>
            <div class="product-price">${p.price} ETB / ብር</div>
            <a href="${telegramUrl}" target="_blank" class="btn-buy">
              <i class="fa-paper-plane fa-brands"></i> ${buyText}
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Admin Panel Logic
    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
      renderAdminList();
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
      resetForm();
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const products = getProducts();

      const newProd = {
        id: id ? parseInt(id) : Date.now(),
        nameEn: document.getElementById('prod-name-en').value,
        nameAm: document.getElementById('prod-name-am').value,
        category: document.getElementById('prod-category').value,
        price: parseFloat(document.getElementById('prod-price').value),
        img: document.getElementById('prod-img').value,
        descEn: document.getElementById('prod-desc-en').value,
        descAm: document.getElementById('prod-desc-am').value
      };

      if (id) {
        // Edit existing
        const index = products.findIndex(p => p.id === parseInt(id));
        products[index] = newProd;
      } else {
        // Add new
        products.push(newProd);
      }

      saveProductsToStorage(products);
      resetForm();
    }

    function editProduct(id) {
      const products = getProducts();
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-name-en').value = p.nameEn;
      document.getElementById('prod-name-am').value = p.nameAm;
      document.getElementById('prod-category').value = p.category;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-img').value = p.img;
      document.getElementById('prod-desc-en').value = p.descEn;
      document.getElementById('prod-desc-am').value = p.descAm;
    }

    function deleteProduct(id) {
      if (confirm('Are you sure you want to delete this item? / ለመሰረዝ እርግጠኛ ነዎት?')) {
        let products = getProducts();
        products = products.filter(p => p.id !== id);
        saveProductsToStorage(products);
      }
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('prod-id').value = '';
    }

    function renderAdminList() {
      const products = getProducts();
      const listContainer = document.getElementById('admin-items-list');
      listContainer.innerHTML = '';

      products.forEach(p => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.innerHTML = `
          <span><strong>${p.nameEn}</strong> - ${p.price} ETB</span>
          <div>
            <button class="btn" style="background:#ffc107; padding: 4px 8px;" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i> Edit</button>
            <button class="btn btn-danger" style="padding: 4px 8px;" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    // Load initial views
    renderProducts();
  </script>
</body>
</html>
